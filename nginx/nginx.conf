events {
    worker_connections 1024;
}

http {

    # [추가] 로그 설정: Nginx를 통과하는 트래픽의 접속 기록과 에러를 남깁니다.
    # Docker 환경에서는 이 로그들이 컨테이너의 표준 출력(stdout/stderr)으로 전달되어 `docker logs nginx`로 확인 가능합니다.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 1. 분산시킬 서버 그룹을 정의합니다. (Round-Robin 방식)
    upstream spring_servers {
        server dc-server-1:8080;
        server dc-server-2:8080;
        server dc-server-3:8080;
    }

    server {
        # 2. 클라이언트가 80번 포트로 들어오면
        listen 80;

        location / {
            # 3. 위에서 정의한 spring_servers 그룹으로 트래픽을 던집니다.
            proxy_pass http://spring_servers;

            # 헤더 정보 유지
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # [추가] 타임아웃 설정: 대규모 트래픽이나 DB 지연 시 Nginx가 무한정 기다리며 터지는 것을 방지합니다.
            proxy_connect_timeout 5s;   # Spring Boot 서버와 연결을 맺는 데 기다리는 최대 시간 (5초)
            proxy_send_timeout 10s;     # Spring Boot 서버로 요청 데이터를 보내는 데 기다리는 최대 시간 (10초)
            proxy_read_timeout 10s;     # Spring Boot 서버로부터 응답을 받는 데 기다리는 최대 시간 (10초)
        }
    }

}